<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>C&amp;I Simulator</title>
<meta name="description" content="Тренажёр приводов для КИПиА и АСУ ТП">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="core/theme.css">
<style>
:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-ui);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 24px;display:flex;flex-direction:column;gap:14px}
h1{font:700 1.4em/1.1 var(--f-mono);margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.list{display:flex;flex-direction:column;gap:10px}
a.unit{display:flex;align-items:center;min-height:52px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);text-decoration:none}
a.unit:focus-visible{outline:2px solid var(--air);outline-offset:2px}
.unit b{font-size:1.05em}
.unit span{color:var(--muted);font-size:.9em}
.tag{align-self:flex-start;font:600 .72em var(--f-mono);padding:2px 7px;border-radius:5px;border:1px solid currentColor;color:var(--ok)}
.tag.beta{color:var(--warn)}
footer{color:var(--muted);font-size:.8em}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>C&amp;I Simulator</h1></header>
  <div class="list" id="list">
    <a class="unit" href="units/esd-ball-rp/index.html"><b>Отсечной клапан ПАЗ</b></a>
  </div>
</div>
<script>
fetch('units/index.json').then((r) => r.json()).then((units) => {
  document.getElementById('list').innerHTML = units.map((u) =>
    `<a class="unit" href="units/${u.id}/index.html"><b>${u.title}</b></a>`).join('');
}).catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
