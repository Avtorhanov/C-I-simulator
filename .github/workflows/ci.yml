name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Юнит-тесты моделей
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: E2E на профиле телефона (CPU×6)
        run: npm run e2e
